name = "quien-no-corre-vuela"
main = "src/index.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# La web: build/build.mjs la escribe en dist/ (un HTML por página e idioma, con el
# contenido dentro) y Cloudflare la sirve directa. wrangler lanza el build antes de
# publicar (y en `wrangler dev`), así que en Workers Builds cada push publica solo.
[build]
command = "node build/build.mjs"
watch_dir = ["build", "data", "products", "authors", "pages", "public", "schema"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
# Solo pasan por el Worker la API y las direcciones de antes, para llevarlas a las nuevas.
run_worker_first = [
  "/api/*", "/producto", "/autor",
  "/index.html", "/about.html", "/autores.html", "/autor.html", "/producto.html",
  "/calendario.html", "/newsletter.html", "/contacto.html", "/legal.html",
  "/checkout.html", "/gracias.html", "/sorry.html",
]

# D1 — SQLite serverless. Solo guarda lo mutable (stock, pedidos, newsletter, mensajes).
# El catálogo vive en products/<id>/product.json (se edita y se hace push).
[[d1_databases]]
binding = "DB"
database_name = "shop"
database_id = "57f55099-2e3f-4ea5-827f-232224cf3f70"

# Variables NO secretas (se pueden commitear). Vacío = el Worker usa el origen de la petición.
[vars]
FRONTEND_URL = ""

# ─── Avisos por email (ver README, "Avisos por email") ───────────────────────
# Estado: EMAIL_TIENDA vacío ⇒ NO se manda nada todavía. La tienda funciona igual.
# Para encenderlo faltan dos cosas (ninguna es código):
#   1. npx wrangler email sending enable quiennocorrevuela.com
#      (añade SPF y DKIM — OJO si el dominio ya tiene un SPF, hay que fusionarlos)
#   2. npx wrangler email routing addresses create <email-de-andrea>
#      (verifica el destino; es lo que hace que los avisos internos sean gratis)
#   3. rellenar EMAIL_TIENDA aquí abajo y descomentar el bloque [[send_email]].
#
# noreply@ no necesita buzón real: basta con que el dominio esté dado de alta.
EMAIL_FROM = "noreply@quiennocorrevuela.com"
EMAIL_TIENDA = ""            # ← email de Andrea. Varios separados por coma.
EMAIL_RESPUESTA = ""         # ← a dónde responde el cliente (noreply@ no lo lee nadie)
TIENDA_NOMBRE = "Quien no corre, vuela"

# Transporte: binding de Cloudflare, sin API key. Descomentar tras el paso 1.
#   destination_address restringe el binding a UNA dirección: déjalo si solo quieres
#   los avisos internos (gratis en plan free). Quítalo para escribir también a clientes,
#   lo que requiere Workers Paid.
# [[send_email]]
# name = "EMAIL"
# destination_address = ""

# Alternativa sin tocar DNS: Resend → npx wrangler secret put RESEND_API_KEY

# Los secretos se añaden por CLI (NO van aquí):
#   npx wrangler secret put STRIPE_SECRET_KEY
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET
#   npx wrangler secret put ADMIN_TOKEN
# En local van en .dev.vars (ver .dev.vars.example).
